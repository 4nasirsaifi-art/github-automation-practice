name: Python & Docker CI-CD Automation

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          echo "Building Docker Image..."
          docker build -t gitauto-app .

      - name: Run Container & Verify Output
        env:
          MY_API_KEY: ${{ secrets.MY_API_KEY }}
        run: |
          echo "Running Docker Container..."
          docker run --rm -e MY_API_KEY="$MY_API_KEY" gitauto-app